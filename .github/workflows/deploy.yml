name: Deploy to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Notify Aidan on build failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Deploy failed on ${context.sha.slice(0, 7)}`;
            const body = [
              `The GitHub Pages build failed.`,
              ``,
              `- **Actor (who pushed):** @${context.actor}`,
              `- **Commit:** ${context.sha}`,
              `- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `This issue is filed so Aidan is notified — not only the committee member who saved.`,
              `Please check place validation errors in the workflow log, fix or coach, then close this issue.`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: body + "\n\ncc @duinneacha",
              assignees: ["duinneacha"],
            });

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
